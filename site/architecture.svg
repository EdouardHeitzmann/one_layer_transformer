<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1160" role="img" aria-labelledby="title desc">
  <title id="title">Architecture of the one-layer modular-addition transformer</title>
  <desc id="desc">Input tokens are one-hot encoded as x. Token and position embeddings produce x0 using W_E and W_p. Four independent attention heads, indexed 0 through 3, each use their own slices W_Q[h], W_K[h], W_V[h], and W_O[h]. Each head computes attention scores S_h, softmax weights A_h, and projected values. The four projected head outputs are summed, then x0 is added to produce x1. An MLP uses W_i and b_i to produce mlp, then W_o and b_o produce x2. W_U gives logits. The answer position is compared to y with cross-entropy loss.</desc>
  <defs>
    <style>
      .bg{fill:#f8f6f0}.box{fill:#fffefb;stroke:#b9c7ba;stroke-width:2}.accent{fill:#e5efe5;stroke:#668873;stroke-width:2}.warm{fill:#f7edda;stroke:#bf9b5c;stroke-width:2}
      .title{font-family:Georgia,serif;font-size:25px;font-weight:700;fill:#21382e}.label{font-family:Arial,sans-serif;font-size:20px;font-weight:700;fill:#243d32}.detail{font-family:Arial,sans-serif;font-size:15px;fill:#41554a}.param{font-family:monospace;font-size:17px;font-weight:700;fill:#305e48}.act{font-family:monospace;font-size:17px;font-weight:700;fill:#774d1d}.headtitle{font-family:Arial,sans-serif;font-size:17px;font-weight:700;fill:#243d32}.headparam{font-family:monospace;font-size:14px;font-weight:700;fill:#305e48}.headdetail{font-family:Arial,sans-serif;font-size:13px;fill:#41554a}.arrow{stroke:#668873;stroke-width:2;fill:none;marker-end:url(#head)}.branch{stroke:#668873;stroke-width:2;fill:none}
    </style>
    <marker id="head" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#668873"/></marker>
  </defs>
  <rect width="1120" height="1160" rx="20" class="bg"/>
  <text x="48" y="49" class="title">One forward pass: modular addition mod N</text>
  <text x="48" y="77" class="detail">N = config.modulus · B = batch size · T = 3 · V = N + 1 tokens · D = 128 · H = 4 heads · K = 32 per head</text>

  <rect x="50" y="103" width="1020" height="74" rx="12" class="box"/>
  <text x="75" y="134" class="label">Input and tokenizer</text><text x="75" y="158" class="detail">(a, b, ?) → one-hot</text>
  <text x="785" y="139" class="act">x [B,T,V]</text>
  <path d="M560 177 V196" class="arrow" fill="none" stroke="#668873" stroke-width="2" marker-end="url(#head)"/>

  <rect x="50" y="204" width="1020" height="78" rx="12" class="accent"/>
  <text x="75" y="235" class="label">Token + position embeddings</text><text x="75" y="260" class="detail">x₀ = x · W_E + W_p</text>
  <text x="785" y="227" class="param">W_E [V,D]</text><text x="785" y="249" class="param">W_p [T,D]</text>
  <text x="785" y="271" class="act">x0 [B,T,D]</text>
  <path d="M560 282 V309" class="arrow" fill="none" stroke="#668873" stroke-width="2" marker-end="url(#head)"/>

  <text x="560" y="342" text-anchor="middle" class="label">Four independent attention heads</text>
  <text x="560" y="367" text-anchor="middle" class="detail">For each h = 0, 1, 2, 3: Q[h] = x0 W_Q[h], K[h] = x0 W_K[h], V[h] = x0 W_V[h]</text>
  <path d="M560 375 V393 M170 393 H950" class="branch" fill="none" stroke="#668873" stroke-width="2"/>
  <path d="M170 393 V411" class="arrow" fill="none" stroke="#668873" stroke-width="2" marker-end="url(#head)"/>
  <path d="M430 393 V411" class="arrow" fill="none" stroke="#668873" stroke-width="2" marker-end="url(#head)"/>
  <path d="M690 393 V411" class="arrow" fill="none" stroke="#668873" stroke-width="2" marker-end="url(#head)"/>
  <path d="M950 393 V411" class="arrow" fill="none" stroke="#668873" stroke-width="2" marker-end="url(#head)"/>

  <rect x="50" y="415" width="240" height="167" rx="12" class="box"/>
  <text x="68" y="442" class="headtitle">Head 1 · h = 0</text>
  <text x="68" y="467" class="headparam">W_Q[0], W_K[0]</text>
  <text x="68" y="489" class="headparam">W_V[0], W_O[0]</text>
  <text x="68" y="516" class="headdetail">S[0] = Q[0] K[0]^T</text>
  <text x="68" y="538" class="headdetail">A[0] = softmax(S[0])</text>
  <text x="68" y="560" class="headdetail">O[0] = A[0] V[0] W_O[0]</text>

  <rect x="310" y="415" width="240" height="167" rx="12" class="box"/>
  <text x="328" y="442" class="headtitle">Head 2 · h = 1</text>
  <text x="328" y="467" class="headparam">W_Q[1], W_K[1]</text>
  <text x="328" y="489" class="headparam">W_V[1], W_O[1]</text>
  <text x="328" y="516" class="headdetail">S[1] = Q[1] K[1]^T</text>
  <text x="328" y="538" class="headdetail">A[1] = softmax(S[1])</text>
  <text x="328" y="560" class="headdetail">O[1] = A[1] V[1] W_O[1]</text>

  <rect x="570" y="415" width="240" height="167" rx="12" class="box"/>
  <text x="588" y="442" class="headtitle">Head 3 · h = 2</text>
  <text x="588" y="467" class="headparam">W_Q[2], W_K[2]</text>
  <text x="588" y="489" class="headparam">W_V[2], W_O[2]</text>
  <text x="588" y="516" class="headdetail">S[2] = Q[2] K[2]^T</text>
  <text x="588" y="538" class="headdetail">A[2] = softmax(S[2])</text>
  <text x="588" y="560" class="headdetail">O[2] = A[2] V[2] W_O[2]</text>

  <rect x="830" y="415" width="240" height="167" rx="12" class="box"/>
  <text x="848" y="442" class="headtitle">Head 4 · h = 3</text>
  <text x="848" y="467" class="headparam">W_Q[3], W_K[3]</text>
  <text x="848" y="489" class="headparam">W_V[3], W_O[3]</text>
  <text x="848" y="516" class="headdetail">S[3] = Q[3] K[3]^T</text>
  <text x="848" y="538" class="headdetail">A[3] = softmax(S[3])</text>
  <text x="848" y="560" class="headdetail">O[3] = A[3] V[3] W_O[3]</text>

  <path d="M170 582 V601 M430 582 V601 M690 582 V601 M950 582 V601 M170 601 H950" class="branch" fill="none" stroke="#668873" stroke-width="2"/>
  <path d="M560 601 V619" class="arrow" fill="none" stroke="#668873" stroke-width="2" marker-end="url(#head)"/>
  <rect x="50" y="627" width="1020" height="83" rx="12" class="accent"/>
  <text x="75" y="659" class="label">Sum projected head outputs, then add the residual</text>
  <text x="75" y="688" class="detail">x1 = x0 + Σ(h=0..3) O[h] = x0 + Σ(h=0..3) [A[h] (x0 W_V[h]) W_O[h]]</text>
  <text x="825" y="688" class="act">x1 [B,T,D]</text>
  <path d="M560 710 V748" class="arrow" fill="none" stroke="#668873" stroke-width="2" marker-end="url(#head)"/>

  <rect x="50" y="756" width="1020" height="84" rx="12" class="box"/>
  <text x="75" y="787" class="label">MLP hidden activation</text>
  <text x="75" y="813" class="detail">mlp = ReLU(x₁ · W_i) + b_i</text>
  <text x="785" y="779" class="param">W_i [D,512]</text><text x="785" y="801" class="param">b_i [512]</text>
  <text x="785" y="823" class="act">mlp [B,T,512]</text>
  <path d="M560 840 V860" class="arrow" fill="none" stroke="#668873" stroke-width="2" marker-end="url(#head)"/>

  <rect x="50" y="868" width="1020" height="75" rx="12" class="accent"/>
  <text x="75" y="899" class="label">MLP output</text><text x="75" y="924" class="detail">x₂ = mlp · W_o + b_o</text>
  <text x="785" y="891" class="param">W_o [512,D]</text><text x="785" y="913" class="param">b_o [D]</text>
  <text x="785" y="935" class="act">x2 [B,T,D]</text>
  <path d="M560 943 V963" class="arrow" fill="none" stroke="#668873" stroke-width="2" marker-end="url(#head)"/>

  <rect x="50" y="971" width="1020" height="73" rx="12" class="box"/>
  <text x="75" y="1002" class="label">Unembedding</text><text x="75" y="1026" class="detail">logits = x₂ · W_U; one score per token</text>
  <text x="785" y="1002" class="param">W_U [D,V]</text><text x="785" y="1029" class="act">logits [B,T,V]</text>
  <path d="M560 1044 V1063" class="arrow" fill="none" stroke="#668873" stroke-width="2" marker-end="url(#head)"/>

  <rect x="50" y="1071" width="1020" height="62" rx="12" class="warm"/>
  <text x="75" y="1102" class="label">Answer loss</text><text x="75" y="1124" class="detail">Cross-entropy of logits[:, −1, :] against target y[:, −1, :]</text>
  <text x="785" y="1105" class="act">scalar loss</text>
</svg>
